[pytest]
# Replace 'config.settings' with the actual path to your settings file 
# (e.g., 'myproject.settings' or 'core.settings')
DJANGO_SETTINGS_MODULE = config.settings

# Tell pytest to look for test files with these naming patterns
python_files = test_*.py *_tests.py

# Automatically append the root directory to PYTHONPATH so 'apps.agent' imports resolve cleanly
pythonpath = .
